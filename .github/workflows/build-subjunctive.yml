name: Build subjunctive worksheets

on:
  push:
    paths:
      - '.github/workflows/build-subjunctive.yml'
      - 'scripts/build-subjunctive.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and PDF libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
          python -m pip install reportlab==4.4.9 pymupdf
      - name: Generate PDFs
        run: python scripts/build-subjunctive.py
      - name: Verify PDF structure and page bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          files=sorted(Path('.').glob('仮定法_*.pdf'))
          assert len(files)==6, f'Expected 6 PDFs, got {len(files)}'
          for file in files:
              d=fitz.open(file)
              assert len(d)==3, f'{file}: expected 3 pages, got {len(d)}'
              assert all(len(page.get_text())>250 for page in d), file
              for page in d:
                  for w in page.get_text('words'):
                      assert w[0]>38 and w[2]<560 and w[1]>14 and w[3]<830, (file,w)
              body=' '.join(page.get_text() for page in d)
              assert '解答' in body and '全文和訳' in body, file
              assert 'no less than' not in body.lower() and 'not more than' not in body.lower()
              print(file, len(d),'pages',file.stat().st_size,'bytes: OK')
          PY
      - name: Publish PDFs to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '仮定法_'*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish six reviewed subjunctive PDF worksheets"
            git push
          fi
