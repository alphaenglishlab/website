name: Build relative-pronoun PDFs

on:
  push:
    paths:
      - 'scripts/build_relatives.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF generator
        run: python -m pip install reportlab==4.4.9
      - name: Generate worksheets
        run: python scripts/build_relatives.py
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '関係詞_'*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish audited relative-pronoun worksheets"
            git push
          fi
