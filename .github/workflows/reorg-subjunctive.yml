name: Publish reorganized subjunctive PDFs
on:
  push:
    paths:
      - '.github/workflows/reorg-subjunctive.yml'
      - 'scripts/build-reorg-subj.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
          python -m pip install reportlab==4.4.9 PyMuPDF==1.24.14
      - name: Generate four new or reorganized PDF lessons
        run: python scripts/build-reorg-subj.py
      - name: Check PDF page count, text, margins, and excluded comparison grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          names=[
           '仮定法_仮定法未来_レベル1-1.pdf',
           '仮定法_混合仮定法・条件表現_レベル1-1.pdf',
           '仮定法_願望・後悔・選好_レベル1-1.pdf',
           '仮定法_仮想・時期・条件の表現_レベル1-1.pdf'
          ]
          for name in names:
           path=Path(name)
           assert path.is_file(),name
           doc=fitz.open(path)
           assert len(doc)==3,(name,len(doc))
           body=' '.join(p.get_text() for p in doc)
           assert '解答' in body and '全文和訳' in body,name
           assert not any(x in body.lower() for x in ['no less than','not more than','no more a fish than','クジラ構文']),name
           for page in doc:
            for w in page.get_text('words'):
             assert w[0]>35 and w[2]<568 and w[1]>13 and w[3]<830,(name,w)
           print(name,len(doc),'pages',path.stat().st_size,'bytes')
          PY
      - name: Commit updated PDF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '仮定法_仮定法未来_レベル1-1.pdf' '仮定法_混合仮定法・条件表現_レベル1-1.pdf' '仮定法_願望・後悔・選好_レベル1-1.pdf' '仮定法_仮想・時期・条件の表現_レベル1-1.pdf'
          if ! git diff --cached --quiet; then
            git commit -m "Publish future conditionals and revised subjunctive groupings"
            git push
          fi
