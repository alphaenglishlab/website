<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルファ英語教材</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f8f9fb;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 20px;
      color: #555;
      margin-bottom: 30px;
    }

    .notice {
      background: #fff3cd;
      color: #856404;
      padding: 18px;
      border-radius: 12px;
      font-size: 18px;
      margin: 30px auto;
      max-width: 600px;
    }

    .btn {
      display: block;
      width: 320px;
      margin: 20px auto;
      padding: 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
    }

    .disabled {
      background: #999;
      pointer-events: none;
      cursor: not-allowed;
    }

    .xlink {
      margin-top: 30px;
      font-size: 16px;
    }

    .xlink a {
      color: #1d9bf0;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>アルファ英語教材</h1>
  <p class="sub">Xから来てくれてありがとうございます。</p>

  <div class="notice">
    🚧 教材サイト準備中です。<br>
    無料教材・有料教材を順次追加予定です。
  </div>

  <a class="btn" href="不定詞の名詞的用法レベル1-1.pdf" target="_blank">無料教材はこちら</a>
  <a class="btn disabled">有料教材（準備中）</a>

  <div class="xlink">
    最新情報は <a href="https://x.com/君のID" target="_blank">Xで更新中</a>
  </div>

</body>
</html>
