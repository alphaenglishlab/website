<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルファ英語教材</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f8f9fb;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 22px;
      color: #555;
      margin-bottom: 30px;
    }

    .notice {
      background: #fff3cd;
      color: #856404;
      padding: 20px;
      border-radius: 14px;
      font-size: 20px;
      margin: 30px auto 50px;
      max-width: 700px;
    }

    h2 {
      font-size: 42px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 30px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      padding: 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 15px;
    }

    .disabled {
      background: #999;
      pointer-events: none;
      cursor: not-allowed;
    }

    .xlink {
      margin-top: 60px;
      font-size: 18px;
    }

    .xlink a {
      color: #1d9bf0;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 40px;
      }

      h2 {
        font-size: 30px;
      }

      .card h3 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <h1>アルファ英語教材</h1>
  <p class="sub">Xから来てくれてありがとうございます。</p>

  <div class="notice">
    🚧 教材サイト準備中です。<br>
    現在、サンプル教材を試験公開中です。
  </div>

  <h2>単元一覧</h2>

  <div class="grid">

    <div class="card">
      <h3>不定詞</h3>
      <a class="btn" href="不定詞の名詞的用法レベル1-1.pdf" target="_blank">
        名詞的用法（基礎①）
      </a>
      <a class="btn disabled">形容詞的用法（準備中）</a>
      <a class="btn disabled">副詞的用法（準備中）</a>
    </div>

    <div class="card">
      <h3>関係代名詞</h3>
      <a class="btn disabled">準備中</a>
    </div>

    <div class="card">
      <h3>分詞</h3>
      <a class="btn disabled">準備中</a>
    </div>

    <div class="card">
      <h3>動名詞</h3>
      <a class="btn disabled">準備中</a>
    </div>

    <div class="card">
      <h3>比較</h3>
      <a class="btn disabled">準備中</a>
    </div>

    <div class="card">
      <h3>仮定法</h3>
      <a class="btn disabled">準備中</a>
    </div>

  </div>

  <div class="xlink">
    最新情報は <a href="https://x.com/君のID" target="_blank">Xで更新中</a>
  </div>

</body>
</html>
